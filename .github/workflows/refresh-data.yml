name: refresh-data

on:
  schedule:
    # 23:35 UTC on weekdays, after the US close and the FRED daily update.
    - cron: "35 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --quiet --upgrade yfinance

      - name: Download prices
        run: |
          python - <<'PY'
          import os, sys, time
          import yfinance as yf

          TICKERS = ["SPY", "RSP", "XLY", "XLP", "HYG", "IEF"]
          os.makedirs("data", exist_ok=True)
          failed = []

          for tic in TICKERS:
              try:
                  df = yf.Ticker(tic).history(period="10y", auto_adjust=True)
                  if df is None or len(df) < 300:
                      raise ValueError("only %d rows" % (0 if df is None else len(df)))
                  rows = ["Date,Open,High,Low,Close"]
                  for r in df.reset_index().itertuples(index=False):
                      rows.append("%s,%.2f,%.2f,%.2f,%.2f" % (
                          r.Date.strftime("%Y-%m-%d"), r.Open, r.High, r.Low, r.Close))
                  with open("data/%s.csv" % tic, "w") as fh:
                      fh.write("\n".join(rows) + "\n")
                  print("ok   %-4s %5d rows, last %s" % (tic, len(df), rows[-1].split(",")[0]))
              except Exception as exc:
                  print("FAIL %-4s %s" % (tic, exc))
                  failed.append(tic)
              time.sleep(2)

          if "SPY" in failed:
              sys.exit(1)
          PY

      - name: Download macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error

          IDS = ["VIXCLS", "BAMLH0A0HYM2", "T10Y2Y", "NFCI"]
          KEY = os.environ.get("FRED_API_KEY", "").strip()
          START = "2014-01-01"
          UA = {"User-Agent": "Mozilla/5.0 (compatible; spy-entry-risk/4)",
                "Accept": "text/csv,application/json,*/*"}
          os.makedirs("data", exist_ok=True)
          missing = []

          def get(url, timeout=40):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", "replace")

          def write(sid, pairs):
              if len(pairs) < 200:
                  raise ValueError("only %d observations" % len(pairs))
              with open("data/%s.csv" % sid, "w") as fh:
                  fh.write("observation_date,%s\n" % sid)
                  for d, v in pairs:
                      fh.write("%s,%s\n" % (d, v))
              print("ok   %-13s %5d rows, last %s" % (sid, len(pairs), pairs[-1][0]))

          def via_api(sid):
              url = ("https://api.stlouisfed.org/fred/series/observations"
                     "?series_id=%s&api_key=%s&file_type=json&observation_start=%s"
                     % (sid, KEY, START))
              obs = json.loads(get(url))["observations"]
              return [(o["date"], o["value"]) for o in obs if o["value"] not in (".", "")]

          def via_graph(sid):
              txt = get("https://fred.stlouisfed.org/graph/fredgraph.csv?id=%s" % sid)
              out = []
              for line in txt.splitlines()[1:]:
                  p = line.split(",")
                  if len(p) >= 2 and p[1].strip() not in (".", ""):
                      out.append((p[0].strip(), p[1].strip()))
              return out

          for sid in IDS:
              done = False
              routes = ([("fred api", via_api)] if KEY else []) + [("fredgraph", via_graph)]
              for label, fn in routes:
                  try:
                      write(sid, fn(sid))
                      done = True
                      break
                  except urllib.error.HTTPError as exc:
                      print("     %-13s %s -> HTTP %s" % (sid, label, exc.code))
                  except Exception as exc:
                      print("     %-13s %s -> %s" % (sid, label, str(exc)[:120]))
              if not done:
                  missing.append(sid)
                  print("FAIL %-13s all routes" % sid)

          if not KEY:
              print("note: FRED_API_KEY secret is not set, so only the blocked endpoint was tried")
          if missing:
              print("missing: " + ", ".join(missing))
          PY

      - name: VIX backstop from Yahoo
        run: |
          python - <<'PY'
          import os
          if os.path.exists("data/VIXCLS.csv"):
              print("VIXCLS already present, backstop not needed")
              raise SystemExit(0)
          import yfinance as yf
          df = yf.Ticker("^VIX").history(period="10y", auto_adjust=False)
          if df is None or len(df) < 300:
              print("FAIL ^VIX backstop")
              raise SystemExit(0)
          with open("data/VIXCLS.csv", "w") as fh:
              fh.write("observation_date,VIXCLS\n")
              for r in df.reset_index().itertuples(index=False):
                  fh.write("%s,%.2f\n" % (r.Date.strftime("%Y-%m-%d"), r.Close))
          print("ok   VIXCLS from Yahoo ^VIX, %d rows" % len(df))
          PY

      - name: Report
        run: |
          echo "files in data:"
          ls -la data
          n=$(ls data/*.csv 2>/dev/null | wc -l)
          echo "$n of 10 series present"

      - name: Commit if changed
        run: |
          git config user.name "spy-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
