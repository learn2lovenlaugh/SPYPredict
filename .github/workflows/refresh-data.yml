name: refresh-data

on:
  schedule:
    # 23:35 UTC on weekdays, after the US close and the FRED daily update.
    - cron: "35 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --quiet --upgrade yfinance

      - name: Download prices
        run: |
          python - <<'PY'
          import os, sys, time
          import yfinance as yf

          TICKERS = ["SPY", "RSP", "XLY", "XLP", "HYG", "IEF"]
          YEARS = "10y"          # about 2520 trading days, matches the dashboard default
          os.makedirs("data", exist_ok=True)
          failed = []

          for tic in TICKERS:
              try:
                  df = yf.Ticker(tic).history(period=YEARS, auto_adjust=True)
                  if df is None or len(df) < 300:
                      raise ValueError("only %d rows" % (0 if df is None else len(df)))
                  rows = ["Date,Open,High,Low,Close"]
                  for r in df.reset_index().itertuples(index=False):
                      rows.append("%s,%.2f,%.2f,%.2f,%.2f" % (
                          r.Date.strftime("%Y-%m-%d"), r.Open, r.High, r.Low, r.Close))
                  with open("data/%s.csv" % tic, "w") as fh:
                      fh.write("\n".join(rows) + "\n")
                  print("ok   %-4s %5d rows, last %s" % (tic, len(df), rows[-1].split(",")[0]))
              except Exception as exc:
                  print("FAIL %-4s %s" % (tic, exc))
                  failed.append(tic)
              time.sleep(2)

          # SPY is required. Anything else keeps whatever copy is already committed.
          if "SPY" in failed:
              sys.exit(1)
          PY

      - name: Download macro series
        run: |
          set -u
          UA="Mozilla/5.0 (compatible; spy-entry-risk/3)"
          for id in VIXCLS BAMLH0A0HYM2 T10Y2Y NFCI; do
            out="data/$id.csv"
            if curl -fsS --retry 3 --retry-delay 4 -A "$UA" \
                 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id" -o "$out.tmp" \
               && [ "$(wc -l < "$out.tmp")" -gt 200 ]; then
              mv "$out.tmp" "$out"; echo "ok   $id $(wc -l < "$out") rows"
            else
              rm -f "$out.tmp"; echo "FAIL $id, keeping previous copy"
            fi
          done
          ls -la data

      - name: Commit if changed
        run: |
          git config user.name "spy-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
